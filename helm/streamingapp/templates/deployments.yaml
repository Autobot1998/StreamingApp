{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "streamingapp.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.registry }}/{{ $svc.image }}:{{ default $.Values.global.imageTag $svc.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- if ne $name "frontend" }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret
          {{- end }}
          readinessProbe:
            {{- if eq $name "frontend" }}
            httpGet:
              path: /
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            {{- if eq $name "frontend" }}
            httpGet:
              path: /
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
